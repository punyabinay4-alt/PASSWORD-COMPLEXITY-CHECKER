<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Complexity Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #2454a6;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .input-box {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        .check-btn {
            width: 100%;
            margin-top: 15px;
            background: #2454a6;
            color: white;
            font-weight: bold;
        }

        .check-btn:hover {
            background: #173d7c;
        }

        .show-btn {
            background: #eee;
        }

        .result {
            margin-top: 25px;
            display: none;
        }

        .score {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
        }

        .strength {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .progress {
            height: 12px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            transition: 0.4s;
        }

        .criteria {
            margin-top: 20px;
        }

        .criteria p {
            margin: 10px 0;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: red;
        }

        .suggestions {
            margin-top: 20px;
            background: #f7f7f7;
            padding: 15px;
            border-radius: 10px;
        }

        .suggestions h3 {
            margin-top: 0;
        }

        ul {
            padding-left: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Password Complexity Checker</h1>

    <p class="subtitle">
        Check how strong your password is
    </p>

    <label for="password">Enter Password</label>

    <div class="input-box">
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            oninput="checkPassword()"
        >

        <button class="show-btn" onclick="togglePassword()">
            Show
        </button>
    </div>

    <button class="check-btn" onclick="checkPassword()">
        Check Password Strength
    </button>

    <div class="result" id="result">

        <div class="score" id="score">
            Score: 0/5
        </div>

        <div class="strength" id="strength">
            Very Weak
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="criteria">

            <p id="length">
                ❌ At least 8 characters
            </p>

            <p id="uppercase">
                ❌ Contains uppercase letter
            </p>

            <p id="lowercase">
                ❌ Contains lowercase letter
            </p>

            <p id="number">
                ❌ Contains a number
            </p>

            <p id="special">
                ❌ Contains special character
            </p>

        </div>

        <div class="suggestions">

            <h3>Suggestions</h3>

            <ul id="suggestionsList"></ul>

        </div>

    </div>

    <div class="footer">
        Password Complexity Checker | HTML, CSS & JavaScript
    </div>

</div>


<script>

function togglePassword() {

    const password = document.getElementById("password");
    const button = document.querySelector(".show-btn");

    if (password.type === "password") {

        password.type = "text";
        button.innerText = "Hide";

    } else {

        password.type = "password";
        button.innerText = "Show";

    }
}


function checkPassword() {

    const password = document.getElementById("password").value;

    const result = document.getElementById("result");

    result.style.display = "block";

    let score = 0;

    const hasLength = password.length >= 8;
    const hasUppercase = /[A-Z]/.test(password);
    const hasLowercase = /[a-z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    const hasSpecial = /[^A-Za-z0-9]/.test(password);


    if (hasLength) score++;
    if (hasUppercase) score++;
    if (hasLowercase) score++;
    if (hasNumber) score++;
    if (hasSpecial) score++;


    document.getElementById("score").innerText =
        "Score: " + score + "/5";


    updateCriteria("length", hasLength, "At least 8 characters");
    updateCriteria("uppercase", hasUppercase, "Contains uppercase letter");
    updateCriteria("lowercase", hasLowercase, "Contains lowercase letter");
    updateCriteria("number", hasNumber, "Contains a number");
    updateCriteria("special", hasSpecial, "Contains special character");


    let strength = "";
    let percentage = 0;

    if (score === 0) {

        strength = "Very Weak";
        percentage = 0;

    } else if (score === 1) {

        strength = "Very Weak";
        percentage = 20;

    } else if (score === 2) {

        strength = "Weak";
        percentage = 40;

    } else if (score === 3) {

        strength = "Medium";
        percentage = 60;

    } else if (score === 4) {

        strength = "Strong";
        percentage = 80;

    } else {

        strength = "Very Strong";
        percentage = 100;

    }


    document.getElementById("strength").innerText =
        strength;


    document.getElementById("progressBar").style.width =
        percentage + "%";


    const suggestionsList =
        document.getElementById("suggestionsList");

    suggestionsList.innerHTML = "";


    if (!hasLength) {
        addSuggestion("Use at least 8 characters.");
    }

    if (!hasUppercase) {
        addSuggestion("Add at least one uppercase letter (A-Z).");
    }

    if (!hasLowercase) {
        addSuggestion("Add at least one lowercase letter (a-z).");
    }

    if (!hasNumber) {
        addSuggestion("Add at least one number (0-9).");
    }

    if (!hasSpecial) {
        addSuggestion("Add a special character such as @, #, $, %, !");
    }

    if (score === 5) {

        addSuggestion("Excellent! Your password meets all complexity requirements.");

    }

}


function updateCriteria(id, valid, text) {

    const element = document.getElementById(id);

    if (valid) {

        element.innerText = "✅ " + text;
        element.className = "valid";

    } else {

        element.innerText = "❌ " + text;
        element.className = "invalid";

    }

}


function addSuggestion(text) {

    const li = document.createElement("li");

    li.innerText = text;

    document.getElementById("suggestionsList").appendChild(li);

}

</script>

</body>
</html>
